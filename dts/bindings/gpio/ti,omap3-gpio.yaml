description: |
  GPIO bank of TI OMAP3 SoCs, 32 pins. Pull resistors are part of the pad
  configuration.

compatible: "ti,omap3-gpio"

include: [gpio-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  "#gpio-cells":
    const: 2

gpio-cells:
  - pin
  - flags

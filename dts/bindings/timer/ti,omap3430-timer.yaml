description: TI OMAP3 general-purpose timer (GPTIMER)

compatible: "ti,omap3430-timer"

include: base.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  clock-frequency:
    type: int
    required: true
    description: |
      Frequency of the functional clock the SoC selects for the timer, in
      Hz. GPTIMER1 runs from SYS_CLK, whose rate depends on the board's
      oscillator.

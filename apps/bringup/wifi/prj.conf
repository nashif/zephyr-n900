# Build with -S cdc-acm-console: the shell runs on the USB serial port.
# CONFIG_WIFI_WL1251_FIRMWARE and CONFIG_WIFI_WL1251_NVS must name the
# firmware and calibration files, which are not in this repository.
CONFIG_SHELL=y
CONFIG_REBOOT=y
CONFIG_LOG=y
CONFIG_THREAD_NAME=y
# The die ID makes the MAC address
CONFIG_HWINFO=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SHELL=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_MGMT_EVENT_INFO=y
# Scan results come as a burst of events
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=32
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
# Room for a few full-size frames each way
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=160
CONFIG_NET_BUF_TX_COUNT=160

CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_SHELL=y

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SHELL_STACK_SIZE=8192

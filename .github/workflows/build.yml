name: Build

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  build:
    name: Build apps and tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: zephyr-n900
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a # v1.0.15
        with:
          app-path: zephyr-n900
          toolchains: arm-zephyr-eabi:x86_64-zephyr-elf

      # The phone and camera apps need a local Linux tree for the camera
      # sensor tables
      - name: Build apps
        working-directory: zephyr-n900
        run: west twister -T apps -p n900 --exclude-tag needs-linux -v --inline-logs

      - name: Driver build tests
        working-directory: zephyr-n900
        run: west twister -T tests -p native_sim -v --inline-logs

      - name: Runner tests
        working-directory: zephyr-n900
        run: ZEPHYR_BASE=$PWD/../zephyr pytest scripts/tests
